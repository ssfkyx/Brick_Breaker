name: Deploy web app to GitHub Pages

# This copy lives inside web/ so the folder is self-contained: if you copy the
# contents of web/ to the root of a new repository, this workflow will publish
# the app on Pages.  The repository itself may also carry a root-level copy at
# .github/workflows/web-pages.yml that publishes the web/ subfolder.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
